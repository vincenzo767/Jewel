# Render Blueprint: the Spring Boot API (Render dashboard > New > Blueprint).
# Secrets marked "sync: false" are asked for when the Blueprint is created.
services:
  - type: web
    name: bryles-diamonds-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/featured
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Real client IPs (from Vercel and Render's proxies) for sign-in rate limiting
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      - key: SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES
        value: ".*"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
