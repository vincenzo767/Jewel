# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Connection details come from DB_URL / DB_USERNAME / DB_PASSWORD in backend/.env.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/brylesdb?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
