# Application settings. Everything secret or environment-specific comes from environment variables,
# normally set in backend/.env (gitignored; see backend/.env.example). Real environment variables
# take precedence over the file, and blank values count as unset (see DotEnvLoader).
# Defaults below are only safe, non-secret local-development fallbacks.

spring.application.name=brylesdiamonds-api
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------- Database ----------
# DB_URL / DB_USERNAME / DB_PASSWORD, e.g. Supabase PostgreSQL. Without DB_URL, an embedded
# H2 database is used, persisted to ./data.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/brylesdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=20000
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
app.upload-dir=${UPLOAD_DIR:./uploads}
# Supabase Storage: when URL and secret key are set, photos go to a public-read bucket
# (created automatically) and photos still in UPLOAD_DIR are moved there on startup.
app.supabase.url=${SUPABASE_URL:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:jewelry}

# ---------- Security ----------
# JWT_SECRET: 32+ random characters. If unset, a random key is generated at startup
# (everyone is signed out on each restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}
app.cookie.secure=${COOKIE_SECURE:false}
app.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Brute-force protection
app.security.max-failed-logins=5
app.security.lock-minutes=15
app.security.ip-login-attempts-per-15min=30
app.security.ip-registrations-per-hour=10

# ---------- Seed data ----------
# The owner/admin account is created on first start only, from ADMIN_EMAIL / ADMIN_PASSWORD.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Bryle Owner}
# Starter catalogue on an empty database, plus an optional demo customer account.
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.demo-customer.email=${DEMO_CUSTOMER_EMAIL:}
app.demo-customer.password=${DEMO_CUSTOMER_PASSWORD:}
